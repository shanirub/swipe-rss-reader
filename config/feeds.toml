# Feed definitions. Re-read on every fetch run; invalid file aborts the run.
# `id` is a stable slug: never change it once swipes reference it.

[defaults]
# Skip entries published longer ago than this (missing date = fetch time).
# Temporary: keeps the initial backlog out until retention is settled.
max_item_age_hours = 24

# --- Privacy & Surveillance ---

[[feeds]]
id = "krebs"
name = "Krebs on Security"
url = "https://krebsonsecurity.com/feed/"

[[feeds]]
id = "intercept"
name = "The Intercept"
url = "https://theintercept.com/feed/?rss"

[[feeds]]
id = "markup"
name = "The Markup"
url = "https://themarkup.org/feeds/rss.xml"

[[feeds]]
id = "eff"
name = "EFF"
url = "https://www.eff.org/rss/updates.xml"

