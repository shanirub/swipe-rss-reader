# Deploy: git pull && docker compose up -d --build

x-backend: &backend
  build: ./backend
  image: swipe-rss-backend:latest
  environment:
    SWIPE_RSS_DB: /data/swipe_rss.db
    SWIPE_RSS_FEEDS: /config/feeds.toml
    # Optional in .env (Compose substitutes it for every service; the token stays api-only).
    SWIPE_RSS_LOG_LEVEL: ${SWIPE_RSS_LOG_LEVEL:-INFO}
  volumes:
    - data:/data
    # Directory, not file: git pull replaces feeds.toml with a new inode, which a
    # single-file bind mount would not see until the container restarts.
    - ./config:/config:ro
  # Docker's default json-file driver never deletes logs; keep at most 3 × 10 MB per container.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot: applies migrations before anything else touches the database.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  scheduler:
    <<: *backend
    command: ["supercronic", "/app/crontab"]
    environment:
      SWIPE_RSS_DB: /data/swipe_rss.db
      SWIPE_RSS_FEEDS: /config/feeds.toml
      SWIPE_RSS_LOG_LEVEL: ${SWIPE_RSS_LOG_LEVEL:-INFO}
      SWIPE_RSS_BACKUP_DIR: /backups
    # Own list: a merge key replaces lists instead of extending them. Only the scheduler gets the
    # backup directory: a host directory outside the repo and outside every Docker volume, so
    # `docker compose down -v` or a volume prune can't delete the backups (PROJECT_PLAN.md §3 Backups).
    # Create it once, owned by the container user: sudo install -d -o 10001 -g 10001 ~/swipe-rss-backups
    volumes:
      - data:/data
      - ./config:/config:ro
      - ${SWIPE_RSS_BACKUP_HOST_DIR:-../swipe-rss-backups}:/backups
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # HTTP API (FastAPI under uvicorn). Published on the host's loopback only; Tailscale Serve
  # (:8443, set up on the host) forwards to it. Inside the container uvicorn listens on all of
  # the container's own interfaces, otherwise Docker's port forwarding could not reach it.
  api:
    <<: *backend
    command: ["uvicorn", "swipe_rss.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    # Only this service gets the token. Optional for Compose on purpose: without .env only the API
    # fails (it refuses to start without a strong token), the fetcher and extraction keep running.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  data:
